name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q Messages-fa.zip -d src
          ls src/Messages-master

      # PvotLib (git submodule) is not inside the zip, so fetch it here
      - name: Fetch PvotLib
        run: |
          cd src/Messages-master
          rm -rf PvotLib
          git clone --depth 1 https://github.com/PVOT-OSS/PvotLib PvotLib

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK
        working-directory: src/Messages-master
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        continue-on-error: true
        working-directory: src/Messages-master
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: src/Messages-master/presentation/build/outputs/apk/**/*.apk
